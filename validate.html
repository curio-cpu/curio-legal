<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curio — Validation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 50px;
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 8px;
}

.logo span {
  color: #d9ad55;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 30px;
}

.video-box {
  width: 100%;
  max-width: 420px;
  margin: auto;
  background: #111;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(217,173,85,0.15);
}

video {
  width: 100%;
  display: block;
  aspect-ratio: 9 / 16;
  object-fit: cover;
}

.title {
  text-align: center;
  font-size: 20px;
  margin: 25px 0 20px;
}

.buttons {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.validate {
  background: #d9ad55;
  color: #050505;
}

.modify {
  background: #222;
  color: white;
  border: 1px solid #555;
}

.reject {
  background: #181818;
  color: #aaa;
  border: 1px solid #333;
}

.status {
  text-align: center;
  margin-top: 25px;
  min-height: 25px;
  color: #d9ad55;
}

.info {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 30px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <span>C</span>urio
  </div>

  <div class="subtitle">
    Vidéo prête pour validation
  </div>

  <div class="video-box">
    <video
      controls
      playsinline
      preload="metadata"
      src="2026-09-22-173225235.mp4">
    </video>
  </div>

  <div class="title">
    Les premières balles de golf sur la Lune
  </div>

  <div class="buttons">

    <button class="validate" onclick="validateVideo()">
      ✓ VALIDER ET PUBLIER
    </button>

    <button class="modify" onclick="modifyVideo()">
      ✎ MODIFIER
    </button>

    <button class="reject" onclick="rejectVideo()">
      ✕ REJETER
    </button>

  </div>

  <div id="status" class="status"></div>

  <div class="info">
    La publication TikTok ne sera lancée qu'après
    validation explicite.
  </div>

</div>

<script>

function validateVideo() {
  const status = document.getElementById("status");

  status.textContent =
    "Validation enregistrée — publication TikTok à venir.";

  // La connexion à l'API TikTok sera ajoutée
  // après validation de cette interface.
}

function modifyVideo() {
  document.getElementById("status").textContent =
    "Vidéo envoyée pour modification.";
}

function rejectVideo() {
  document.getElementById("status").textContent =
    "Vidéo rejetée.";
}

</script>

</body>
</html>
